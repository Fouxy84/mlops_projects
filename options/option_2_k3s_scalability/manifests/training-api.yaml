apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: training-api
  template:
    metadata:
      labels:
        app: training-api
    spec:
      containers:
        - name: training-api
          image: your-dockerhub-user/mlops-training-api:latest
          ports:
            - containerPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: training-api
spec:
  selector:
    app: training-api
  ports:
    - port: 8002
      targetPort: 8002
