apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-api
  labels:
    app: training-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: training-api
  template:
    metadata:
      labels:
        app: training-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: training-api
          image: your-dockerhub-user/mlops-training-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: mlops-config
            - secretRef:
                name: mlops-secrets
          env:
            - name: DAGSHUB_NO_PROMPT
              value: "true"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: training-api
  labels:
    app: training-api
spec:
  selector:
    app: training-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
