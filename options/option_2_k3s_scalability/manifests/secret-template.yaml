# SECRET TEMPLATE — ne pas committer avec de vraies valeurs
# Remplacez les valeurs par leur encodage base64 : echo -n "valeur" | base64
#
# Pour créer le secret dans le cluster :
#   kubectl -n mlops create secret generic mlops-secrets \
#     --from-literal=API_TOKEN=mlops-secret-token \
#     --from-literal=DAGSHUB_TOKEN=votre-token \
#     --from-literal=DAGSHUB_USER_TOKEN=votre-token
#
apiVersion: v1
kind: Secret
metadata:
  name: mlops-secrets
type: Opaque
stringData:
  API_TOKEN: "mlops-secret-token"          # à remplacer
  DAGSHUB_TOKEN: "votre-dagshub-token"     # à remplacer
  DAGSHUB_USER_TOKEN: "votre-dagshub-token"
