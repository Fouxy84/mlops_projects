global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]

  - job_name: predict_text_api
    metrics_path: /metrics
    static_configs:
      - targets: ["predict-text-api:8000"]

  - job_name: predict_image_api
    metrics_path: /metrics
    static_configs:
      - targets: ["predict-image-api:8000"]

  - job_name: training_api
    metrics_path: /metrics
    static_configs:
      - targets: ["training-api:8002"]
