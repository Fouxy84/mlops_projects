name: CI - MLOps Pipeline

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r tests/requirements_dev.txt

      - name: Run tests with coverage
        run: python -m pytest tests --disable-warnings -q --cov --cov-report=term-missing --cov-report=xml --cov-report=html #--cov-fail-under=60

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: |
            coverage.xml
            htmlcov/

  airflow:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Airflow deps
        run: pip install -r airflow/requirements.txt

      - name: Validate DAGs
        run: python -m py_compile airflow/dags/*.py

  docker:
    runs-on: ubuntu-latest
    needs: [test, airflow]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: gateway
            dockerfile: gateway/dockerfile
          - image_name: auth-api
            dockerfile: src/gateway/Dockerfile
          - image_name: predict-text-api
            dockerfile: src/inference/Dockerfile
          - image_name: predict-image-api
            dockerfile: src/inference/Dockerfile
          - image_name: training-api
            dockerfile: src/training/Dockerfile
          - image_name: mlflow
            dockerfile: src/mlflow/Dockerfile
          - image_name: dvc-runner
            dockerfile: airflow/dvc/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref_name == 'master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref_name == 'master' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mlops-${{ matrix.image_name }}:latest

  deploy-dagshub:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DVC
        run: pip install dvc dagshub

      - name: Push code to DagsHub
        run: |
          git remote add dagshub https://${{ secrets.DAGSHUB_USERNAME }}:${{ secrets.DAGSHUB_TOKEN }}@dagshub.com/${{ secrets.DAGSHUB_USERNAME }}/mlops_projects.git || true
          git push dagshub ${{ github.ref_name }} --force

      - name: Push DVC data to DagsHub
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
        run: |
          dvc remote modify dagshub --local auth basic
          dvc remote modify dagshub --local user $DAGSHUB_USERNAME
          dvc remote modify dagshub --local password $DAGSHUB_TOKEN
          dvc push -r dagshub || echo "DVC push skipped (no remote or no data changes)"
