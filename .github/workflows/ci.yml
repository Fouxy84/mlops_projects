name: CI - MLOps Pipeline

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r tests/requirements_dev.txt

      - name: Run tests
        run: python -m pytest tests --disable-warnings -q

  airflow:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Airflow deps
        run: pip install -r airflow/requirements.txt

      - name: Validate DAGs
        run: python -m py_compile airflow/dags/*.py

  docker:
    runs-on: ubuntu-latest
    needs: [test, airflow]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: gateway
            dockerfile: gateway/dockerfile
          - image_name: auth-api
            dockerfile: src/gateway/Dockerfile
          - image_name: predict-text-api
            dockerfile: src/inference/Dockerfile
          - image_name: predict-image-api
            dockerfile: src/inference/Dockerfile
          - image_name: training-api
            dockerfile: src/training/Dockerfile
          - image_name: mlflow
            dockerfile: src/mlflow/Dockerfile
          - image_name: dvc-runner
            dockerfile: airflow/dvc/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref_name == 'master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref_name == 'master' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mlops-${{ matrix.image_name }}:latest
